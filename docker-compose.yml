services:
  openkeep:
    build:
      context: .
      target: deps
    user: "1000:1000"
    hostname: openkeep
    ports:
      - "9847:9847"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ./data:/app/data
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/openkeep.db
      - PORT=9847
      - DISCOVERY_PORT=9099
      - MCP_PORT=9847
    command: >
      sh -c "node mcp-announce-start.js &
             pnpm prisma migrate dev --skip-generate &&
             pnpm dev -p 9847"
    restart: unless-stopped
    networks:
      - default
      - mcp-net

volumes:
  node_modules:

networks:
  mcp-net:
    external: true
